<html lang="es">
<head>
  <meta charset="utf-8" />

    :root{
      --fg:#0f172a;
      --bg:#eaf3ee;
      --bg2:#dfeee7;
      --line:#d7e6dc;
      --ok:#0a6b3a;
      --l:#0a6b3a;
      --v:#c62828;
      --e:#6b7280;
      --rowA:#f6fbf8;
      --rowB:#eff7f2;
      --oro:#ffd966;
      --plata:#ffecb3;
      --shadow: 0 8px 20px rgba(2, 44, 20, .10);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      background: radial-gradient(1200px 520px at 50% -140px, #ffffff 0%, var(--bg) 55%, var(--bg2) 100%);
      color:var(--fg);
    }
    .wrap{ max-width:900px; margin:0 auto; padding:0 12px 16px; }

    .sticky{
      position:sticky;
      top:0;
      z-index:50;
      background: var(--bg);
      padding-top:10px;
      padding-bottom:8px;
    }

    .title{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:2px;
      padding:10px 12px;
      background: var(--rowB);
      border:1px solid var(--line);
      border-radius:12px;
      margin-bottom:6px;
      text-align:center;
      box-shadow: var(--shadow);
    }
    .title h1{ font-size:26px; margin:0; letter-spacing:.03em; }
    .title h1 .title-q{color:var(--l);}
    .title h1 .title-a{color:var(--v);}
    .title small{ font-size:16px; color:#334155; font-weight:900; }

    .resumenPartidos{
      display:flex;
      flex-direction:column;
      gap:3px;
      padding:6px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      margin-bottom:6px;
      box-shadow: var(--shadow);
    }
    .chipPartido{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:11px;
      font-weight:800;
      color:#334155;
      border-radius:8px;
      padding:5px 8px;
    }
    .chipPartido:nth-child(odd){ background:var(--rowA); }
    .chipPartido:nth-child(even){ background:var(--rowB); }
    .chipPartido .r{
      font-size:12px;
      font-weight:900;
      border-radius:6px;
      padding:2px 7px;
      min-width:20px;
      text-align:center;
      flex:0 0 auto;
    }
    .chipPartido .r.L, .chipPartido .r.E, .chipPartido .r.V{ background:var(--ok); color:#fff; }
    .chipPartido .equipo1{ flex:1; text-align:right; font-size:13px; }
    .chipPartido .equipo2{ flex:1; text-align:left; font-size:13px; }
    .chipPartido .m{
      font-size:13px;
      font-weight:900;
      color:#fff;
      background:var(--ok);
      border-radius:6px;
      padding:3px 8px;
      flex:0 0 auto;
      min-width:34px;
      max-width:110px;
      text-align:center;
      white-space:nowrap;
    }
    .chipPartido .escudo{
      width:20px;
      height:20px;
      object-fit:contain;
      flex:0 0 auto;
    }

    .searchBar{
      display:flex;
      gap:8px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      box-shadow: var(--shadow);
    }
    .searchBar input{
      flex:1;
      padding:14px 14px;
      border:1px solid var(--line);
      border-radius:10px;
      font-size:16px;
      outline:none;
    }
    .searchBar button{
      padding:14px 18px;
      border-radius:10px;
      border:1px solid #0f172a;
      background:#0f172a;
      color:#fff;
      font-weight:800;
      font-size:15px;
      transition: transform .08s ease, background-color .12s ease;
    }
    .searchBar button:active{
      transform: scale(.92);
      background:#0a6b3a;
      border-color:#0a6b3a;
    }

    .premiosGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin:8px 0;
    }
    .premioCard{
      background:#fff;
      border:2px solid var(--line);
      border-radius:14px;
      padding:14px 10px;
      text-align:center;
      box-shadow: var(--shadow);
    }
    .premioCard .lugarTitulo{
      font-size:18px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.03em;
      color:#0f172a;
    }
    .premioCard .lugarDesc{
      font-size:13px;
      font-weight:700;
      color:#334155;
      margin-top:4px;
      line-height:1.3;
    }
    .premioCard .val{
      font-size:26px;
      font-weight:900;
      margin-top:8px;
      color:#0a6b3a;
    }
    .premioCard.oro{ border-color:#c9a227; background:var(--oro); }
    .premioCard.plata{ border-color:#e6c200; background:#fffaeb; }

    .mini{
      display:block;
      padding:8px 14px;
      border-radius:10px;
      border:1px solid #0f172a;
      background:#fff;
      color:#0f172a;
      font-weight:800;
      font-size:13px;
      transition: transform .08s ease, background-color .12s ease;
    }
    .mini:active{ transform: scale(.94); background:#0f172a; color:#fff; }

    .infoResultados{
      font-size:11px;
      color:#64748b;
      text-align:center;
      margin:4px 0 8px;
    }

    .searchBanner{
      display:none;
      background:var(--ok);
      border:2px solid #0a6b3a;
      color:#fff;
      font-size:16px;
      font-weight:900;
      text-align:center;
      padding:14px 12px;
      border-radius:14px;
      margin:8px 0;
      box-shadow: 0 8px 20px rgba(10,107,58,.25);
    }
    .workingMsg{
      display:none;
      background:#eef2f2;
      border:2px solid #94a3b8;
      color:#334155;
      font-size:14px;
      font-weight:800;
      text-align:center;
      padding:10px 12px;
      border-radius:12px;
      margin:8px 0;
      animation: pulseWorking 1.1s ease-in-out infinite;
    }
    @keyframes pulseWorking{
      0%, 100%{ opacity:1; }
      50%{ opacity:.55; }
    }
    .dotsAnim span{
      display:inline-block;
      animation: dotBounce 1.1s infinite;
      animation-fill-mode: both;
    }
    .dotsAnim span:nth-child(2){ animation-delay:.15s; }
    .dotsAnim span:nth-child(3){ animation-delay:.3s; }
    @keyframes dotBounce{
      0%, 60%, 100%{ transform:translateY(0); }
      30%{ transform:translateY(-4px); }
    }

    .tableWrap{ overflow-x:auto; }
    table{ width:100%; border-collapse:collapse; font-size:12px; }
    thead th{
      position:sticky; top:0;
      font-size:9px;
      font-weight:900;
      color:#334155;
      padding:5px 3px;
      border-bottom:2px solid var(--line);
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }
    thead th.plain{ writing-mode:horizontal-tb; text-align:left; background:var(--rowB); }
    thead th.colA{ background:var(--rowA); }
    thead th.colB{ background:var(--rowB); }
    tbody td{
      padding:5px 3px;
      text-align:center;
      border-bottom:1px solid var(--line);
      white-space:nowrap;
    }
    tbody td.nombre{ text-align:left; font-weight:800; white-space:normal; font-size:11px; }
    tbody tr:nth-child(odd){ background:var(--rowA); }
    tbody tr.lugar1{ background:var(--oro) !important; }
    tbody tr.lugar2{ background:var(--plata) !important; }

      border-radius:5px;
      font-weight:900;
      color:#334155;
      background:#eef2f2;
      font-size:11px;

    .sel.hit{ background:var(--ok); color:#fff; }
    tbody td.hit{
      background:var(--ok);
      color:#fff;
      font-weight:900;
      border-radius:5px;

    tbody td.colA:not(.hit){ background:var(--rowA); }

      align-items:center;
      justify-content:center;
      gap:10px;
      margin-top:10px;
      font-size:12px;
      font-weight:800;

      border-radius:8px;

      background:#fff;
      transition: transform .08s ease, background-color .12s ease, box-shadow .12s ease;
    }

    .pager button:active:not(:disabled){

      background:#0f172a;
      color:#fff;
      box-shadow: 0 2px 6px rgba(2,6,23,.25);
    }

      text-align:center;
      padding:24px 12px;
      font-weight:800;
      color:#334155;
    }
    .errbox{
      display:none;
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      z-index:999;
      min-width:280px;
      max-width:88%;
      background:#fff;
      border:2px solid #c62828;
      color:#c62828;
      padding:18px 20px;
      border-radius:16px;
      box-shadow:0 10px 24px rgba(0,0,0,.25);
      text-align:center;
      font-weight:800;
    }

</head>

function logoTag_(nombreEquipo){
  const src = TEAM_LOGOS[nombreEquipo];
  return src ? `<img class="escudo" src="${src}" alt="${nombreEquipo}">` : '';
}

let currentPage = 1;
let currentQuery = '';
let currentTotalPages = 1;
let cabeceraPintada = false;

function renderResumenPartidos(data){
  if (cabeceraPintada) return;
  cabeceraPintada = true;

  let html = '';
  data.partidos.forEach((p, i) => {
    const res = data.resultados[i] || '';
    const marc = data.marcadores[i] || '-';
    const partes = String(p).split(' vs ');
    const equipo1 = partes[0] || '';
    const equipo2 = partes[1] || '';
    html += `
      <div class="chipPartido">
        <span class="r ${res}">${res || '-'}</span>
        ${logoTag_(equipo1)}
        <span class="equipo1">${equipo1}</span>
        <span class="m">${marc}</span>
        <span class="equipo2">${equipo2}</span>
        ${logoTag_(equipo2)}
      </div>
    `;
  });

  $('#resumenPartidos').innerHTML = html;
}

function renderPremios(data){
  const grid = $('#premiosGrid');
  if (!data.resultadosCompletos){
    grid.style.display = 'none';
    return;
  }
  grid.style.display = 'grid';
  const a1 = data.aciertosLugar1 >= 0 ? data.aciertosLugar1 : '—';
  const a2 = data.aciertosLugar2 >= 0 ? data.aciertosLugar2 : '—';
  grid.innerHTML = `
    <div class="premioCard oro">
      <div class="lugarTitulo">1er lugar</div>
      <div class="lugarDesc">${data.ganadores1} quiniela${data.ganadores1===1?'':'s'} ganadora${data.ganadores1===1?'':'s'} con ${a1} aciertos</div>
      <div class="val">${fmtMoney(data.premio1PorQuiniela)}</div>
    </div>
    <div class="premioCard plata">
      <div class="lugarTitulo">2do lugar</div>
      <div class="lugarDesc">${data.ganadores2} quiniela${data.ganadores2===1?'':'s'} ganadora${data.ganadores2===1?'':'s'} con ${a2} aciertos</div>
      <div class="val">${fmtMoney(data.premio2PorQuiniela)}</div>
    </div>
  `;
}

function renderTabla(data){
  const thead = $('#theadRow');
  thead.innerHTML = '<th class="plain">Nombre</th>';
  data.partidos.forEach((p, i) => {
    const th = document.createElement('th');
    th.className = i % 2 === 0 ? 'colA' : 'colB';
    th.textContent = p;
    thead.appendChild(th);
  });
  const thA = document.createElement('th');
  thA.className = 'plain';
  thA.textContent = 'Aciertos';
  thead.appendChild(thA);

  const tbody = $('#tbody');
  tbody.innerHTML = '';

  data.quinielas.forEach(q => {
    const tr = document.createElement('tr');
    if (q.lugar === 1) tr.classList.add('lugar1');
    else if (q.lugar === 2) tr.classList.add('lugar2');

    let selsHtml = '';
    q.sels.forEach((s, i) => {
      const hit = data.resultados[i] && s === data.resultados[i];
      const colClass = i % 2 === 0 ? 'colA' : 'colB';
      selsHtml += `<td class="${colClass} ${hit ? 'hit' : ''}">${s || '-'}</td>`;
    });

    const premioTxt = q.premio ? fmtMoney(q.premio) : '';

    tr.innerHTML = `
      <td class="nombre">#${q.numero} · ${q.nombre}</td>
      ${selsHtml}
      <td><span class="aciertosBadge">${q.aciertos}</span></td>
    `;
    tbody.appendChild(tr);
  });

  $('#infoResultados').textContent = `${data.totalRows} quiniela${data.totalRows===1?'':'s'} encontrada${data.totalRows===1?'':'s'}`;
  document.querySelectorAll('.pagerInfo').forEach(el => {
    el.textContent = `Página ${data.page} de ${data.totalPages}`;
  });
  document.querySelectorAll('.btnFirst').forEach(el => { el.disabled = data.page <= 1; });
  document.querySelectorAll('.btnPrev').forEach(el => { el.disabled = data.page <= 1; });
  document.querySelectorAll('.btnNext').forEach(el => { el.disabled = data.page >= data.totalPages; });
  document.querySelectorAll('.btnLast').forEach(el => { el.disabled = data.page >= data.totalPages; });
}

function loadMonitor(page, q, motivo){
  $('#loading').style.display = cabeceraPintada ? 'none' : 'block';

  const working = $('#workingMsg');
  if (cabeceraPintada) {
    working.style.display = 'block';
    const texto = motivo === 'buscar' ? 'Buscando quinielas' : 'Cargando página';
    working.innerHTML = texto + '<span class="dotsAnim"><span>.</span><span>.</span><span>.</span></span>';
  }

  const vParam = new URLSearchParams(location.search).get('v');

  const url = SHEET_ENDPOINT_PUBLIC
    + '?mode=monitor&page=' + page
    + '&pageSize=2000'
    + '&q=' + encodeURIComponent(q || '')
    + (vParam ? '&v=' + encodeURIComponent(vParam) : '')
    + '&_=' + Date.now();

  fetch(url, { cache: 'no-store' })
    .then(r => r.json())
    .then(res => {
      if (!res.ok || !res.data) throw new Error('Respuesta inválida');
      working.style.display = 'none';
      $('#err').style.display = 'none';
      $('#loading').style.display = 'none';
      $('#content').style.display = 'block';
      renderResumenPartidos(res.data);
      renderPremios(res.data);
      renderTabla(res.data);
      if (res.data.semana) {
        document.querySelector('.title small').textContent = 'SEMANA ' + res.data.semana
          + (res.data.version ? ' · Versión ' + res.data.version : '');
      }

      const banner = $('#searchBanner');
      const btnVolver = $('#btnVolverListado');
      if (q) {
        banner.style.display = 'block';
        banner.textContent = res.data.totalRows === 0
          ? `No se encontraron quinielas para "${q}"`
          : `Se encontraron ${res.data.totalRows} quiniela${res.data.totalRows===1?'':'s'} para "${q}"`;
        btnVolver.style.display = 'block';
      } else {
        banner.style.display = 'none';
        btnVolver.style.display = 'none';
      }

      currentPage = res.data.page;
      currentTotalPages = res.data.totalPages;
      currentQuery = q || '';
      $('.searchBar').scrollIntoView({ block: 'start', behavior: 'instant' });
    })
    .catch(() => {
      working.style.display = 'none';
      $('#loading').style.display = 'none';
      $('#err').style.display = 'block';
      $('#errText').textContent = 'No se pudo cargar el listado.';
    });
}

$('#btnReintentar').addEventListener('click', () => {
  $('#err').style.display = 'none';
  loadMonitor(currentPage || 1, currentQuery || '');
});

$('#buscador').addEventListener('input', e => {
  const pos = e.target.selectionStart;
  const before = e.target.value;
  const after = quitarAcentosBusqueda_(before);
  const delta = after.length - before.length;
  e.target.value = after;
  e.target.setSelectionRange(pos + delta, pos + delta);
});

$('#btnVolverListado').addEventListener('click', () => {
  $('#buscador').value = '';
  loadMonitor(1, '', 'pagina');
});

$('#btnBuscar').addEventListener('click', () => {
  loadMonitor(1, $('#buscador').value.trim(), 'buscar');
});
$('#buscador').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadMonitor(1, $('#buscador').value.trim(), 'buscar');
});
document.querySelectorAll('.btnFirst').forEach(el => el.addEventListener('click', () => {
  if (currentPage > 1) loadMonitor(1, currentQuery, 'pagina');
}));
document.querySelectorAll('.btnPrev').forEach(el => el.addEventListener('click', () => {
  if (currentPage > 1) loadMonitor(currentPage - 1, currentQuery, 'pagina');
}));
document.querySelectorAll('.btnNext').forEach(el => el.addEventListener('click', () => {
  loadMonitor(currentPage + 1, currentQuery, 'pagina');
}));
document.querySelectorAll('.btnLast').forEach(el => el.addEventListener('click', () => {
  loadMonitor(currentTotalPages, currentQuery, 'pagina');
}));

document.body.addEventListener('touchstart', function(){}, false);

document.addEventListener('DOMContentLoaded', () => loadMonitor(1, ''));
</script>
</body>
</html>
