<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cupón - Uso interno</title>

  <style>
    html, body { overflow-x: hidden; }
    :root{
      --fg:#0f172a;
      --bg:#eaf3ee;
      --bg2:#dfeee7;
      --line:#d7e6dc;
      --l:#0a6b3a;
      --v:#c62828;
      --e:#6b7280;
      --rowA:#f6fbf8;
      --rowB:#eff7f2;
      --shadow: 0 8px 20px rgba(2, 44, 20, .10);
      --pickColor: #0a6b3a; /* la cambia el color que elijas */
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      background: radial-gradient(1200px 520px at 50% -140px, #ffffff 0%, var(--bg) 55%, var(--bg2) 100%);
      color:var(--fg);
    }
    .wrap{ max-width:520px; margin:0 auto; padding:12px; }

    /* --- Controles (fuera del cupón) --- */
    .controles{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      margin-bottom:14px;
      box-shadow: var(--shadow);
    }
    .controles label{ font-size:12px; font-weight:800; color:#475569; display:block; margin-bottom:4px; }
    .controles input{
      width:100%;
      padding:11px 10px;
      border:1px solid var(--line);
      border-radius:10px;
      font-size:15px;
      margin-bottom:12px;
      outline:none;
    }
    #nombreInput{ text-transform:uppercase; }

    .colorRow{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:12px;
    }
    .swatch{
      width:30px;
      height:30px;
      border-radius:8px;
      border:3px solid transparent;
      cursor:pointer;
    }
    .swatch.sel{ border-color:#0f172a; }

    .controles .btnLimpiar{
      width:100%;
      padding:11px;
      border-radius:10px;
      border:2px solid #0f172a;
      background:#fff;
      color:#0f172a;
      font-weight:800;
      font-size:13px;
    }

    /* --- El cupón: esto es lo que se captura --- */
    #cupon{
      background: linear-gradient(180deg, #ffffff 0%, #fbfdfc 100%);
      border:1px solid var(--line);
      border-radius:20px;
      overflow:hidden;
      box-shadow: var(--shadow);
      padding:18px 14px 22px;
    }
    .cTitle{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      padding:14px 12px;
      background: var(--rowB);
      border:1px solid var(--line);
      border-radius:14px;
      margin-bottom:12px;
      text-align:center;
    }
    .cTitle h1{ font-size:24px; margin:0; letter-spacing:.03em; }
    .cTitle .q{ color:var(--l); }
    .cTitle .a{ color:var(--v); }
    .cTitle small{ font-size:14px; color:#334155; font-weight:900; }
    .cTitle .precio{ font-size:18px; font-weight:900; margin-top:2px; }

    .cNombreBox{
      background:#fff;
      border:2px solid var(--line);
      border-radius:12px;
      text-align:center;
      font-size:19px;
      font-weight:900;
      padding:10px 8px;
      margin-bottom:12px;
      min-height:1.4em;
      color: var(--pickColor);
      box-shadow: var(--shadow);
    }

    .cCard{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      box-shadow: var(--shadow);
    }
    .cHeadRow{
      display:grid;
      grid-template-columns: 24px 38px 1fr 38px 1fr 38px;
      align-items:center;
      padding:8px 6px;
      background:var(--rowB);
      border-bottom:1px solid var(--line);
    }
    .cHeadRow .l{ text-align:center; font-weight:900; color:#334155; font-size:12px; }

    .cRow{
      display:grid;
      grid-template-columns: 24px 38px 1fr 38px 1fr 38px;
      align-items:center;
      gap:4px;
      padding:8px 6px;
      border-bottom:1px solid rgba(207,229,218,.7);
    }
    .cRow:last-child{ border-bottom:none; }
    .cRow:nth-child(odd){ background:var(--rowA); }
    .cRow:nth-child(even){ background:var(--rowB); }
    .cRow .n{ font-weight:900; font-size:13px; text-align:center; color:#334155; }
    .cRow .team{
      text-align:center;
      font-weight:800;
      padding:2px 2px;
      font-size:11px;
      line-height:1.15;
      white-space:normal;
      word-break:keep-all;
      color:#0f172a;
      min-width:0;
    }
    .cRow .team span{ display:block; }
    .escudoCupon{
      display:block;
      margin:0 auto 4px;
      width:28px;
      height:28px;
      object-fit:contain;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.12));
    }

    .pick{
      width:30px;
      height:30px;
      border:2px solid rgba(15,23,42,.18);
      border-radius:8px;
      margin:0 auto;
      cursor:pointer;
      background: rgba(255,255,255,.92);
      transition: background-color .1s ease, border-color .1s ease, transform .06s ease;
    }
    .pick:active{ transform: scale(.92); }
    .pick.on{
      background: var(--pickColor);
      border-color: var(--pickColor);
    }

    .loading{ text-align:center; padding:30px 10px; font-weight:800; color:#334155; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="controles">
      <label for="nombreInput">Nombre del cupón</label>
      <input id="nombreInput" placeholder="COP AZTECA 1" />

      <label for="partesInput">¿En cuántas partes divides el costo?</label>
      <input id="partesInput" type="number" min="1" value="10" />

      <label>Color del cupón</label>
      <div class="colorRow" id="colorRow"></div>

      <button class="btnLimpiar" id="btnLimpiar">Limpiar selecciones</button>
    </div>

    <div id="cupon">
      <div id="loading" class="loading">Cargando partidos…</div>
      <div id="cuponContenido" style="display:none;">
        <div class="cTitle">
          <h1><span class="q">QUINIELA</span> <span class="a">AZTECA</span></h1>
          <small id="cSemana">SEMANA</small>
          <div class="precio" id="cPrecio">$0</div>
        </div>

        <div class="cNombreBox" id="cNombreBox">&nbsp;</div>

        <div class="cCard">
          <div class="cHeadRow">
            <div></div>
            <div class="l">L</div>
            <div></div>
            <div class="l">E</div>
            <div></div>
            <div class="l">V</div>
          </div>
          <div id="filas"></div>
        </div>
      </div>
    </div>

  </div>

function logoTag_(nombreEquipo){
  const src = TEAM_LOGOS[nombreEquipo];
  return src ? `<img class="escudoCupon" src="${src}" alt="${nombreEquipo}">` : '';
}
let PARTIDOS = [];
let PRECIO_BASE = 25;
let colorSeleccionado = PALETA_COLORES[0];

function renderPaleta(){
  const row = $('#colorRow');
  row.innerHTML = '';
  PALETA_COLORES.forEach((color, idx) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (color === colorSeleccionado ? ' sel' : '');
    sw.style.background = color;
    sw.dataset.color = color;
    sw.title = 'Color ' + (idx + 1);
    row.appendChild(sw);
  });
}

document.addEventListener('click', e => {
  const sw = e.target.closest('.swatch');
  if (!sw) return;
  colorSeleccionado = sw.dataset.color;
  document.documentElement.style.setProperty('--pickColor', colorSeleccionado);
  renderPaleta();
});

$('#nombreInput').addEventListener('input', () => {
  $('#cNombreBox').textContent = $('#nombreInput').value.toUpperCase() || '\u00A0';
});

function renderFilas(){
  const cont = $('#filas');
  cont.innerHTML = '';
  PARTIDOS.slice(0, 9).forEach((p, idx) => {
    const row = document.createElement('div');
    row.className = 'cRow';
    row.innerHTML = `
      <div class="n">${idx + 1}</div>
      <div class="pick" data-i="${idx}" data-k="L"></div>
      <div class="team izq">${logoTag_(p.local)}<span>${p.local}</span></div>
      <div class="pick" data-i="${idx}" data-k="E"></div>
      <div class="team der">${logoTag_(p.visita)}<span>${p.visita}</span></div>
      <div class="pick" data-i="${idx}" data-k="V"></div>
    `;
    cont.appendChild(row);
  });
}

function combosActuales(){
  const map = {};
  document.querySelectorAll('.pick').forEach(p => {
    const i = p.dataset.i;
    map[i] = map[i] || 0;
    if (p.classList.contains('on')) map[i]++;
  });
  let combos = 1;
  Object.values(map).forEach(n => { combos *= Math.max(n, 1); });
  return combos;
}

function actualizarPrecio(){
  const combos = combosActuales();
  const totalCombinacion = combos * PRECIO_BASE;
  const partes = Math.max(1, Number($('#partesInput').value) || 1);
  const precioPorParte = Math.ceil(totalCombinacion / partes);
  $('#cPrecio').textContent = '$' + precioPorParte.toLocaleString('es-MX');
}

document.addEventListener('click', e => {
  const el = e.target.closest('.pick');
  if (!el) return;
  el.classList.toggle('on');
  actualizarPrecio();
});

$('#partesInput').addEventListener('input', actualizarPrecio);

$('#btnLimpiar').addEventListener('click', () => {
  document.querySelectorAll('.pick.on').forEach(p => p.classList.remove('on'));
  actualizarPrecio();
});

function cargarConfig(){
  fetch(SHEET_ENDPOINT_PUBLIC + '?mode=config&_=' + Date.now(), { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      if (!data.ok || !data.cfg) throw new Error('Config inválida');
      const cfg = data.cfg;
      PARTIDOS = cfg.partidos || [];
      PRECIO_BASE = cfg.precio || 25;
      $('#cSemana').textContent = (cfg.subtitulo || 'SEMANA').toUpperCase();
      renderFilas();
      renderPaleta();
      document.documentElement.style.setProperty('--pickColor', colorSeleccionado);
      actualizarPrecio();
      $('#loading').style.display = 'none';
      $('#cuponContenido').style.display = 'block';
    })
    .catch(() => {
      $('#loading').textContent = 'No se pudo cargar. Verifica tu conexión e intenta de nuevo.';
    });
}

document.addEventListener('DOMContentLoaded', cargarConfig);
