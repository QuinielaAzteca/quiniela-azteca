<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cupón - Uso interno</title>

  <style>
    html, body { overflow-x: hidden; }
    :root{
      --fg:#0f172a;
      --bg:#eaf3ee;
      --bg2:#dfeee7;
      --line:#d7e6dc;
      --l:#0a6b3a;
      --v:#c62828;
      --e:#6b7280;
      --pick:54px;
      --rowA:#f6fbf8;
      --rowB:#eff7f2;
      --shadow: 0 8px 20px rgba(2, 44, 20, .10);
      --pickColor: #0a6b3a; /* la cambia el color que elijas */
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      background: radial-gradient(1200px 520px at 50% -140px, #ffffff 0%, var(--bg) 55%, var(--bg2) 100%);
      color:var(--fg);
    }
    .wrap{ max-width:520px; margin:0 auto; padding:12px; }

    /* --- Controles (fuera del cupón) --- */
    .controles{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      margin-bottom:14px;
      box-shadow: var(--shadow);
    }
    .controles label{ font-size:12px; font-weight:800; color:#475569; display:block; margin-bottom:4px; }
    .controles input{
      width:100%;
      padding:11px 10px;
      border:1px solid var(--line);
      border-radius:10px;
      font-size:15px;
      margin-bottom:12px;
      outline:none;
    }
    #nombreInput{ text-transform:uppercase; }

    .colorRow{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:12px;
    }
    .swatch{
      width:30px;
      height:30px;
      border-radius:8px;
      border:3px solid transparent;
      cursor:pointer;
    }
    .swatch.sel{ border-color:#0f172a; }

    .controles .btnLimpiar{
      width:100%;
      padding:11px;
      border-radius:10px;
      border:2px solid #0f172a;
      background:#fff;
      color:#0f172a;
      font-weight:800;
      font-size:13px;
    }

    /* --- El cupón: esto es lo que se captura --- */
    #cupon{
      background: linear-gradient(180deg, #ffffff 0%, #fbfdfc 100%);
      border:1px solid var(--line);
      border-radius:20px;
      overflow:hidden;
      box-shadow: var(--shadow);
      padding:6px 6px 8px;
    }
    .cTitle{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:0px;
      padding:4px 6px;
      background: var(--rowB);
      border:1px solid var(--line);
      border-radius:8px;
      margin-bottom:4px;
      text-align:center;
    }
    .cTitle h1{ font-size:15px; margin:0; letter-spacing:.02em; }
    .cTitle .q{ color:var(--l); }
    .cTitle .a{ color:var(--v); }
    .cTitle small{ font-size:10px; color:#334155; font-weight:900; }
    .cTitle .precio{ font-size:11px; font-weight:900; margin-top:0; }

    .cNombreBox{
      background:#fff;
      border:2px solid var(--line);
      border-radius:7px;
      text-align:center;
      font-size:12px;
      font-weight:900;
      padding:3px 6px;
      margin-bottom:4px;
      min-height:1.1em;
      color: var(--pickColor);
      box-shadow: var(--shadow);
    }

    .cCard{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      box-shadow: var(--shadow);
    }
    .cBar{
      height:8px;
      background:linear-gradient(
        90deg,
        var(--l) 0%,
        var(--l) 33%,
        #ffffff 33%,
        #ffffff 66%,
        var(--v) 66%,
        var(--v) 100%
      );
    }
    .cRow{
      width:100%;
      display:grid;
      grid-template-columns: 24px var(--pick) minmax(0, 1fr) var(--pick) minmax(0, 1fr) var(--pick);
      align-items:center;
      gap:4px;
      padding:2px 4px;
      border-bottom:1px solid rgba(207,229,218,.7);
    }
    .cRow:last-child{ border-bottom:none; }
    .cRow:nth-child(odd){ background:var(--rowA); }
    .cRow:nth-child(even){ background:var(--rowB); }
    .cRow .n{ font-weight:800; text-align:center; font-size:13px; color:#334155; }
    .cRow .team{
      text-align:center;
      font-weight:800;
      padding:2px 2px;
      font-size:12px;
      line-height:1.15;
      white-space:normal;
      word-break:keep-all;
      color:#0f172a;
      min-width:0;
    }
    .cRow .team span{ display:block; }
    .escudoCupon{
      display:block;
      margin:0 auto 2px;
      width:26px;
      height:26px;
      object-fit:contain;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.12));
    }

    .pick{
      display:grid;
      place-items:center;
      width:var(--pick);
      height:var(--pick);
      border:2px solid rgba(15,23,42,.18);
      border-radius:14px;
      margin:0 auto;
      cursor:pointer;
      background: rgba(255,255,255,.92);
      color:#6b7280;
      font-weight:900;
      font-size:18px;
      user-select:none;
      transition: background-color .1s ease, border-color .1s ease, transform .06s ease, color .1s ease;
    }
    .pick:active{ transform: scale(.92); }
    .pick.on{
      background: var(--pickColor);
      border-color: var(--pickColor);
      color:#fff;
    }

    .loading{ text-align:center; padding:30px 10px; font-weight:800; color:#334155; }
    @media (max-width:420px){
      :root{ --pick: 44px; }
      .cRow{
        grid-template-columns: 22px var(--pick) minmax(0, 1fr) var(--pick) minmax(0, 1fr) var(--pick);
        gap:3px;
      }
      .cRow .team{ font-size:11px; }
      .escudoCupon{ height:28px; width:28px; }
      .pick{ border-radius:12px; font-size:16px; }
    }
  </style>
</head>

function logoTag_(nombreEquipo){
  const src = TEAM_LOGOS[nombreEquipo];
  return src ? `<img class="escudoCupon" src="${src}" alt="${nombreEquipo}">` : '';
}
let PARTIDOS = [];
let PRECIO_BASE = 25;
let colorSeleccionado = PALETA_COLORES[0];

function renderPaleta(){
  const row = $('#colorRow');
  row.innerHTML = '';
  PALETA_COLORES.forEach((color, idx) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (color === colorSeleccionado ? ' sel' : '');
    sw.style.background = color;
    sw.dataset.color = color;
    sw.title = 'Color ' + (idx + 1);
    row.appendChild(sw);
  });
}

document.addEventListener('click', e => {
  const sw = e.target.closest('.swatch');
  if (!sw) return;
  colorSeleccionado = sw.dataset.color;
  document.documentElement.style.setProperty('--pickColor', colorSeleccionado);
  renderPaleta();
});

$('#nombreInput').addEventListener('input', () => {
  $('#cNombreBox').textContent = $('#nombreInput').value.toUpperCase() || '\u00A0';
});

function renderFilas(){
  const cont = $('#filas');
  cont.innerHTML = '';
  PARTIDOS.slice(0, 9).forEach((p, idx) => {
    const row = document.createElement('div');
    row.className = 'cRow';
    row.innerHTML = `
      <div class="n">${idx + 1}</div>
      <div class="pick" data-i="${idx}" data-k="L">L</div>
      <div class="team izq">${logoTag_(p.local)}<span>${p.local}</span></div>
      <div class="pick" data-i="${idx}" data-k="E">E</div>
      <div class="team der">${logoTag_(p.visita)}<span>${p.visita}</span></div>
      <div class="pick" data-i="${idx}" data-k="V">V</div>
    `;
    cont.appendChild(row);
  });
}

function combosActuales(){
  const map = {};
  document.querySelectorAll('.pick').forEach(p => {
    const i = p.dataset.i;
    map[i] = map[i] || 0;
    if (p.classList.contains('on')) map[i]++;
  });
  let combos = 1;
  Object.values(map).forEach(n => { combos *= Math.max(n, 1); });
  return combos;
}

function actualizarPrecio(){
  const combos = combosActuales();
  const totalCombinacion = combos * PRECIO_BASE;
  const partes = Math.max(1, Number($('#partesInput').value) || 1);
  const precioPorParte = Math.ceil(totalCombinacion / partes);
  $('#cPrecio').textContent = '$' + precioPorParte.toLocaleString('es-MX');
}

/* -------------------------------------------------------
   Coperachas: lee las 9 selecciones actuales (tu coperacha
   base), identifica cuáles 3 partidos marcaste como
   favoritos (los que dejaste simples), y genera hasta 10
   variantes al azar con estructura libre (3 simples/4
   dobles/2 triples, en cualquier partido), respetando:
   - Un partido favorito, si queda simple, siempre usa tu
     misma letra favorita.
   - Un partido favorito, si queda doble, siempre es
     "favorito + empate" (nunca lo excluye, nunca se combina
     con la opción contraria).
   - Los otros 6 partidos son completamente libres.
   Cada variante generada se verifica matemáticamente para
   garantizar que nunca pueda empatarte en los 9 aciertos.
------------------------------------------------------- */

const LETRAS = ['L','E','V'];
const DOBLES_POSIBLES = ['LE','EV','LV'];
const MAX_VARIANTES_POR_TANDA = 10;
const MAX_INTENTOS = 4000;
const META_COPERACHAS = 6;

let variantesCoperachas = [];   // índice 0 = tu original, luego las generadas
let seleccionadas = new Set();  // índices marcados con la casilla
let vistas = new Set();         // claves ya generadas, para no repetir entre tandas
let indiceVarianteActual = 0;
let selsBase = null;
let favoritosBase = null;

function leerSelsActuales(){
  const sels = [];
  for (let i = 0; i < 9; i++) {
    let letras = '';
    ['L','E','V'].forEach(k => {
      const el = document.querySelector(`.pick[data-i="${i}"][data-k="${k}"]`);
      if (el && el.classList.contains('on')) letras += k;
    });
    sels.push(letras);
  }
  return sels;
}

function aplicarSelsAlCupon(sels){
  document.querySelectorAll('.pick').forEach(p => {
    const i = Number(p.dataset.i);
    const k = p.dataset.k;
    p.classList.toggle('on', (sels[i] || '').includes(k));
  });
  actualizarPrecio();
}

function elegirIndicesAlAzar(n, total){
  const idx = Array.from({length: total}, (_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx.slice(0, n);
}

function generarCandidataAleatoria_(favoritos){
  const simplesIdx = elegirIndicesAlAzar(3, 9);
  const restantes = [];
  for (let i = 0; i < 9; i++) if (!simplesIdx.includes(i)) restantes.push(i);
  const dobleShuffle = restantes.slice();
  for (let i = dobleShuffle.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [dobleShuffle[i], dobleShuffle[j]] = [dobleShuffle[j], dobleShuffle[i]];
  }
  const doblesIdx = dobleShuffle.slice(0, 4);
  const triplesIdx = dobleShuffle.slice(4);

  const sels = new Array(9).fill('');

  simplesIdx.forEach(i => {
    if (favoritos[i]) {
      sels[i] = favoritos[i];
    } else {
      // el empate nunca va solo: si el partido queda simple y no es
      // favorito, solo se elige entre L o V, nunca E
      sels[i] = Math.random() < 0.5 ? 'L' : 'V';
    }
  });

  doblesIdx.forEach(i => {
    if (favoritos[i]) {
      const fav = favoritos[i];
      if (fav === 'L') sels[i] = 'LE';
      else if (fav === 'V') sels[i] = 'EV';
      else sels[i] = DOBLES_POSIBLES[Math.floor(Math.random() * 3)];
    } else {
      sels[i] = DOBLES_POSIBLES[Math.floor(Math.random() * 3)];
    }
  });

  triplesIdx.forEach(i => { sels[i] = 'LEV'; });

  return sels;
}

function esValidaVsBase_(candidata, base){
  for (let i = 0; i < 9; i++) {
    const setCand = new Set(candidata[i].split(''));
    const setBase = new Set(base[i].split(''));
    let interseccion = false;
    setCand.forEach(l => { if (setBase.has(l)) interseccion = true; });
    if (!interseccion) return true;
  }
  return false;
}

function esValidaContraTodas_(candidata, listaExistente){
  for (let j = 0; j < listaExistente.length; j++) {
    if (!esValidaVsBase_(candidata, listaExistente[j])) return false;
  }
  return true;
}

function momioTotalDe_(sels){
  let total = 1;
  sels.forEach((s, i) => {
    const p = PARTIDOS[i];
    if (!p) return;
    if (s.length === 1) {
      const m = { L: p.momioL, E: p.momioE, V: p.momioV }[s];
      if (m) total *= m;
    } else if (s.length === 2) {
      // los dobles se guardan como LE / LV / EV; normalizamos por si acaso
      const orden = { LE: p.momioLE, EL: p.momioLE, LV: p.momioLV, VL: p.momioLV, EV: p.momioEV, VE: p.momioEV };
      const m = orden[s];
      if (m) total *= m;
    }
    // los triples (s.length === 3) no cuentan, equivale a multiplicar por 1
  });
  return total;
}

function generarTandaNueva_(){
  const nuevas = [];
  let intentos = 0;
  // Cada candidata se compara contra tu original Y contra todas las
  // variantes ya aceptadas (de esta tanda y de tandas anteriores),
  // para garantizar que ninguna combinación pueda empatar con otra.

  while (nuevas.length < MAX_VARIANTES_POR_TANDA && intentos < MAX_INTENTOS) {
    intentos++;
    const candidata = generarCandidataAleatoria_(favoritosBase);
    const clave = candidata.join('|');
    if (vistas.has(clave)) continue;
    if (!esValidaContraTodas_(candidata, variantesCoperachas.concat(nuevas))) continue;
    vistas.add(clave);
    nuevas.push(candidata);
  }

  return nuevas;
}

$('#btnGenerarCoperachas').addEventListener('click', () => {
  const aviso = $('#avisoCoperachas');

  // Primera vez: tomamos lo que esté marcado en el cupón como tu original fija.
  // De ahí en adelante, el botón siempre parte de esa misma base, sin importar
  // qué variante estés viendo en pantalla en ese momento.
  if (!selsBase) {
    const sels = leerSelsActuales();
    const nSimples = sels.filter(s => s.length === 1).length;
    const nDobles  = sels.filter(s => s.length === 2).length;
    const nTriples = sels.filter(s => s.length === 3).length;
    const nVacios  = sels.filter(s => s.length === 0).length;

    if (nVacios > 0 || nSimples !== 3 || nDobles !== 4 || nTriples !== 2) {
      aviso.style.display = 'block';
      aviso.textContent = 'Marca exactamente 3 partidos simples (tus favoritos), 4 dobles y 2 triples antes de generar.';
      return;
    }

    const favoritos = {};
    sels.forEach((s, i) => { if (s.length === 1) favoritos[i] = s; });

    selsBase = sels;
    favoritosBase = favoritos;
    variantesCoperachas = [sels];
    vistas = new Set([sels.join('|')]);
    indiceVarianteActual = 0;
    seleccionadas = new Set([0]); // tu original siempre cuenta como una de las 6
  }

  aviso.style.display = 'none';

  const nuevas = generarTandaNueva_();
  if (!nuevas.length) {
    aviso.style.display = 'block';
    aviso.textContent = 'No se encontraron variantes nuevas, intenta de nuevo.';
    return;
  }

  // Ordenamos esta tanda de menor a mayor momio total (más favorecida primero).
  // Si no hay momios capturados en CONFIG, todos dan 1 y el orden no cambia nada.
  nuevas.sort((a, b) => momioTotalDe_(a) - momioTotalDe_(b));

  const indiceDePrimeraNueva = variantesCoperachas.length;
  variantesCoperachas = variantesCoperachas.concat(nuevas);
  indiceVarianteActual = indiceDePrimeraNueva;

  $('#navCoperachas').style.display = 'block';
  mostrarVarianteActual();
});

function actualizarContador(){
  $('#contadorSeleccionadas').textContent = `${seleccionadas.size} de ${META_COPERACHAS} seleccionadas`;
}

function mostrarVarianteActual(){
  aplicarSelsAlCupon(variantesCoperachas[indiceVarianteActual]);
  const esOriginal = indiceVarianteActual === 0;
  const momio = momioTotalDe_(variantesCoperachas[indiceVarianteActual]);
  const momioTexto = ` · Momio ${momio.toFixed(2)}`;
  $('#varInfo').textContent = (esOriginal
    ? `Tu original (1 de ${variantesCoperachas.length})`
    : `Variante ${indiceVarianteActual + 1} de ${variantesCoperachas.length}`) + momioTexto;

  const nombreBase = ($('#nombreInput').value || '').trim().replace(/\s*VAR\s*\d+$/i, '');
  const nombreVar = esOriginal
    ? (nombreBase || 'COPERACHA')
    : (nombreBase ? nombreBase + ' ' : '') + 'VAR ' + indiceVarianteActual;
  $('#nombreInput').value = nombreVar;
  $('#cNombreBox').textContent = nombreVar.toUpperCase();

  $('#checkVariante').checked = seleccionadas.has(indiceVarianteActual);
  actualizarContador();
}

$('#checkVariante').addEventListener('change', e => {
  if (e.target.checked) seleccionadas.add(indiceVarianteActual);
  else seleccionadas.delete(indiceVarianteActual);
  actualizarContador();
});

function irASiguiente(){
  if (!variantesCoperachas.length) return;
  indiceVarianteActual = (indiceVarianteActual + 1) % variantesCoperachas.length;
  mostrarVarianteActual();
}
function irAAnterior(){
  if (!variantesCoperachas.length) return;
  indiceVarianteActual = (indiceVarianteActual - 1 + variantesCoperachas.length) % variantesCoperachas.length;
  mostrarVarianteActual();
}

$('#btnVarSiguiente').addEventListener('click', irASiguiente);
$('#btnVarAnterior').addEventListener('click', irAAnterior);

// Deslizar con el dedo sobre el cupón para navegar entre variantes
(function habilitarSwipe(){
  const zona = document.getElementById('cupon');
  let xInicio = null;

  zona.addEventListener('touchstart', e => {
    if (!variantesCoperachas.length) return;
    xInicio = e.touches[0].clientX;
  }, { passive: true });

  zona.addEventListener('touchend', e => {
    if (xInicio === null || !variantesCoperachas.length) return;
    const xFin = e.changedTouches[0].clientX;
    const delta = xFin - xInicio;
    const UMBRAL = 40;
    if (delta > UMBRAL) irAAnterior();
    else if (delta < -UMBRAL) irASiguiente();
    xInicio = null;
  }, { passive: true });
})();

$('#btnVolverManual').addEventListener('click', () => {
  $('#navCoperachas').style.display = 'none';
  variantesCoperachas = [];
  seleccionadas = new Set();
  vistas = new Set();
  selsBase = null;
  favoritosBase = null;
});

document.addEventListener('click', e => {
  const el = e.target.closest('.pick');
  if (!el) return;
  el.classList.toggle('on');
  actualizarPrecio();
});

$('#partesInput').addEventListener('input', actualizarPrecio);

$('#btnLimpiar').addEventListener('click', () => {
  document.querySelectorAll('.pick.on').forEach(p => p.classList.remove('on'));
  actualizarPrecio();
});

function cargarConfig(){
  fetch(SHEET_ENDPOINT_PUBLIC + '?mode=config&_=' + Date.now(), { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      if (!data.ok || !data.cfg) throw new Error('Config inválida');
      const cfg = data.cfg;
      PARTIDOS = cfg.partidos || [];
      PRECIO_BASE = cfg.precio || 25;
      $('#cSemana').textContent = (cfg.subtitulo || 'SEMANA').toUpperCase();
      renderFilas();
      renderPaleta();
      document.documentElement.style.setProperty('--pickColor', colorSeleccionado);
      actualizarPrecio();
      $('#loading').style.display = 'none';
      $('#cuponContenido').style.display = 'block';
    })
    .catch(() => {
      $('#loading').textContent = 'No se pudo cargar. Verifica tu conexión e intenta de nuevo.';
    });
}

document.addEventListener('DOMContentLoaded', cargarConfig);
</script>
