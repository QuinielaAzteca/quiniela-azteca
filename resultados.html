<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiniela Azteca - Resultados</title>
  <link rel="icon" href="favicon.png" type="image/png" />

  <style>
    html, body { overflow-x: hidden; }
    :root{
      --fg:#0f172a;
      --bg:#eaf3ee;
      --bg2:#dfeee7;
      --line:#d7e6dc;
      --ok:#0a6b3a;
      --l:#0a6b3a;
      --v:#c62828;
      --e:#6b7280;
      --rowA:#f6fbf8;
      --rowB:#eff7f2;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      background: radial-gradient(1200px 520px at 50% -140px, #ffffff 0%, var(--bg) 55%, var(--bg2) 100%);
      color:var(--fg);
    }
    .wrap{ max-width:640px; margin:0 auto; padding:10px 6px 16px; }

    .title{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:2px;
      padding:12px 16px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      margin-bottom:8px;
      text-align:center;
      box-shadow: 0 10px 24px rgba(2,6,23,.06);
    }
    .title h1{ font-size:26px; margin:0; letter-spacing:.03em; font-weight:900; }
    .title h1 .title-q{color:var(--l);}
    .title h1 .title-a{color:var(--v);}
    .title small{ font-size:16px; color:#334155; font-weight:900; }

    .partidos{
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      overflow:hidden;
      box-shadow: 0 10px 24px rgba(2,6,23,.06);
    }
    .fila{
      display:flex;
      align-items:center;
      gap:5px;
      padding:8px 6px;
      min-width:0;
    }
    .fila:nth-child(odd){ background:var(--rowA); }
    .fila:nth-child(even){ background:var(--rowB); }

    .resLetra{
      flex:0 0 auto;
      width:30px;
      height:30px;
      border-radius:9px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      font-weight:900;
      background:var(--ok);
      color:#ffffff;
    }
    .escudo{
      flex:0 0 auto;
      width:24px;
      height:24px;
      object-fit:contain;
    }
    .ladoEquipo{
      flex:1 1 0;
      min-width:0;
      display:flex;
      align-items:center;
      gap:5px;
    }
    .ladoEquipo.der{ justify-content:flex-start; }
    .ladoEquipo.izq{ justify-content:flex-end; }
    .equipo1{ text-align:left; font-size:13px; font-weight:800; line-height:1.12; }
    .equipo2{ text-align:right; font-size:13px; font-weight:800; line-height:1.12; }
    .marcador{
      flex:0 0 auto;
      width:86px;
      text-align:center;
      font-weight:900;
      border-radius:7px;
      padding:6px 4px;
      white-space:nowrap;
      font-size:15px;
    }
    .marcador.sinResultado{ background:#334155; color:#ffffff; }
    .marcador.conResultado{ background:var(--ok); color:#ffffff; }

    @media (min-width:480px){
      .fila{ gap:14px; padding:12px 16px; }
      .resLetra{ width:44px; height:44px; border-radius:12px; font-size:22px; }
      .escudo{ width:38px; height:38px; }
      .equipo1, .equipo2{ font-size:19px; line-height:1.2; }
      .marcador{ width:130px; font-size:23px; border-radius:10px; padding:9px 6px; }
    }

    .loading, .errbox{
      text-align:center;
      padding:40px 12px;
      font-weight:800;
      color:#334155;
      font-size:16px;
    }
    .errbox{ color:#c62828; }

    .footer{
      text-align:center;
      font-size:13px;
      color:#64748b;
      font-weight:700;
      margin-top:14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">
      <h1><span class="title-q">QUINIELA</span> <span class="title-a">AZTECA</span></h1>
      <small id="subtitulo">Cargando…</small>
    </div>

    <div id="loading" class="loading">Cargando resultados…</div>
    <div id="err" class="errbox" style="display:none;"></div>
    <div id="partidos" class="partidos" style="display:none;"></div>

    <div class="footer" id="footer"></div>
  </div>

  'RUMANIA': 'escudos/rumania.png', 'SENEGAL': 'escudos/senegal.png', 'SUDÁFRICA': 'escudos/sudafrica.png',

  'TÚNEZ': 'escudos/tunez.png', 'TURQUÍA': 'escudos/turquia.png', 'UCRANIA': 'escudos/ucrania.png',
  'URUGUAY': 'escudos/uruguay.png', 'UZBEKISTÁN': 'escudos/uzbekistan.png'

function logoTag_(nombreEquipo){
  const src = TEAM_LOGOS[nombreEquipo];
  return src ? `<img class="escudo" src="${src}" alt="${nombreEquipo}">` : '';
}

function renderPartidos(data){
  const wrap = $('#partidos');
  wrap.innerHTML = '';
  data.partidos.forEach((p, i) => {
    const res = data.resultados[i] || '';
    const marc = data.marcadores[i] || '-';
    const partes = String(p).split(' vs ');
    const equipo1 = partes[0] || '';
    const equipo2 = partes[1] || '';
    const fila = document.createElement('div');
    fila.className = 'fila';
    fila.innerHTML = `
      <span class="resLetra" style="${res ? '' : 'visibility:hidden;'}">${res || '-'}</span>
      <span class="ladoEquipo der">
        ${logoTag_(equipo1)}
        <span class="equipo1">${equipo1}</span>
      </span>
      <span class="marcador ${res ? 'conResultado' : 'sinResultado'}">${marc}</span>
      <span class="ladoEquipo izq">
        <span class="equipo2">${equipo2}</span>
        ${logoTag_(equipo2)}
      </span>
    `;
    wrap.appendChild(fila);
  });
  wrap.style.display = 'block';
}

function cargar(){
  const vParam = new URLSearchParams(location.search).get('v');
  const url = SHEET_ENDPOINT_PUBLIC
    + '?mode=monitor&page=1&pageSize=1'
    + (vParam ? '&v=' + encodeURIComponent(vParam) : '')
    + '&_=' + Date.now();

  fetch(url, { cache: 'no-store' })
    .then(r => r.json())
    .then(res => {
      if (!res.ok || !res.data) throw new Error('Respuesta inválida');
      $('#loading').style.display = 'none';
      $('#subtitulo').textContent = 'SEMANA ' + res.data.semana
        + (res.data.version ? ' · Versión ' + res.data.version : '');
      renderPartidos(res.data);
      $('#footer').textContent = 'quinielaazteca.github.io';
    })
    .catch(() => {
      $('#loading').style.display = 'none';
      $('#err').style.display = 'block';
      $('#err').textContent = 'No se pudo cargar. Verifica tu conexión e intenta de nuevo.';
    });
}

document.addEventListener('DOMContentLoaded', cargar);
</script>

</html>
